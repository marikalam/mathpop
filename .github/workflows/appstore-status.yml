# Shows where MathPop stands on the App Store (versions and builds),
# without changing anything (see .github/appstore/status.mjs).
name: App Store status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ.get('ASC_KEY_P8', '')
          body = re.sub(r'(BEGIN|END)\s*PRIVATE\s*KEY', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          with open(sys.argv[1], 'w') as f:
              f.write(pem)
          PY

      - name: Status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          set -o pipefail
          node .github/appstore/status.mjs 2>&1 | tee "$RUNNER_TEMP/out.txt" || status=$?
          echo "::notice title=Status::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$RUNNER_TEMP/out.txt" | tail -c 3500)"
          exit ${status:-0}

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
